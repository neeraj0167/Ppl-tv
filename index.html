    <style>
        * {

            padding: 0;
            box-sizing: border-box;

        body {

            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;

        .container {

        h1 {
            font-size: clamp(32px, 6vw, 64px);
            font-weight: 800;

            letter-spacing: -0.02em;
        }

        .tags {
            position: absolute;
            left: -9999px;
            height: 1px;
            width: 1px;
            overflow: hidden;
        }

        .tag {
            background: #f5f5f5;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1px;
            font-weight: 600;
            color: #333333;
            border: 2px solid #e5e5e5;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), 0 0 0 0 rgba(74, 144, 226, 0);
            }
            50% {
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25), 0 0 30px 5px rgba(74, 144, 226, 0.4);
            }
        }

        .open-button {
            display: inline-block;
            padding: 18px 48px;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            animation: pulse 2s ease-in-out infinite;
        }

        .open-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .open-button:hover::before {
            left: 100%;
        }

        .open-button:hover {
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25), 0 0 20px rgba(74, 144, 226, 0.3);
            animation: none;
        }

        .open-button:active {
            transform: translateY(-1px) scale(1.02);
        }

        .open-button:focus {
            outline: none;
            animation: glow 1.5s ease-in-out infinite;
        }

        .open-button:focus-visible {
            outline: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25), 0 0 30px 5px rgba(74, 144, 226, 0.5);
            animation: glow 1.5s ease-in-out infinite;
        }

        .uptime-container {
            margin-top: 50px;
            padding: 25px;
            background: linear-gradient(145deg, #ffffff, #f5f5f5);
            border-radius: 20px;
            box-shadow: 
                12px 12px 24px rgba(0, 0, 0, 0.1),
                -12px -12px 24px rgba(255, 255, 255, 0.9);
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .uptime-container:hover {
            transform: translateY(-5px);
            box-shadow: 
                15px 15px 30px rgba(0, 0, 0, 0.15),
                -15px -15px 30px rgba(255, 255, 255, 1);
        }

        .uptime-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .uptime-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fetch-indicator {
            position: relative;
            width: 12px;
            height: 12px;
            display: inline-block;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #22c55e;
            border-radius: 50%;
            opacity: 0;
        }

        .pulse-dot {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #22c55e;
            border-radius: 50%;
            opacity: 0.8;
        }

        .fetch-indicator.fetching .pulse-ring {
            animation: pulse-ring 1.5s ease-out infinite;
        }

        .fetch-indicator.fetching .pulse-dot {
            animation: pulse-dot-anim 1.5s ease-out infinite;
        }

        .fetch-indicator.success .pulse-dot {
            background: #22c55e;
            animation: success-pop 0.5s ease-out;
        }

        .fetch-indicator.error .pulse-dot {
            background: #ef4444;
            animation: error-shake 0.5s ease-out;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        @keyframes pulse-dot-anim {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        @keyframes success-pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.5);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes error-shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-3px);
            }
            75% {
                transform: translateX(3px);
            }
        }

            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;

            font-weight: 600;

            transition: all 0.3s ease;

            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.12);

            box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.05);

        }

            font-weight: 600;
        }

            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .status-dot.up {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }

        .status-dot.down {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .uptime-meter {
            display: flex;
            gap: 1px;
            height: 60px;
            margin-bottom: 20px;
            padding: 0;
            background: transparent;
            border-radius: 0;
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #ccc #f1f1f1;
        }

        .uptime-meter::-webkit-scrollbar {
            height: 4px;
        }

        .uptime-meter::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .uptime-meter::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        .uptime-meter::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        .uptime-bar {
            flex: 0 0 auto;
            min-width: 3px;
            max-width: 4px;
            width: 4px;
            border-radius: 0;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            opacity: 1;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .uptime-bar.up {
            background: #10b981;
        }

        .uptime-bar.down {
            background: #ff6b35;
        }

        .uptime-bar.placeholder {
            background: #e5e7eb;
            cursor: default;
            pointer-events: none;
        }

        .uptime-bar:not(.placeholder):hover {
            opacity: 0.7;
            transform: scaleY(1.05);
        }

        .uptime-bar:not(.placeholder).active {
            opacity: 0.7;
            transform: scaleY(1.05);
        }

        .tooltip-popup {
            position: fixed;
            background: rgba(0, 0, 0, 0.95);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;

            z-index: 10000;

            opacity: 0;
            transition: opacity 0.2s ease;

            text-align: center;

        .tooltip-popup.show {
            opacity: 1;
        }

            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);

            border-top-color: rgba(0, 0, 0, 0.95);

            border: 1px solid #f0f0f0;
            box-shadow:

            opacity: 0;
            cursor: default;

        .incident-card.down-card {
            border-left: 4px solid #ef4444;

        .incident-card.resolved-card {
            border-left: 4px solid #22c55e;
            opacity: 0.8;

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }

        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .incident-status {
            font-size: 11px;

            padding: 4px 10px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.3px;

        .incident-status.down {
            background: #fee2e2;
            color: #dc2626;
        }

        .incident-status.resolved {
            background: #dcfce7;
            color: #16a34a;
        }

        .incident-time {

        .stat-item {

    <script>
        let activeBar = null;
        let lastFetchTime = null;
        let fetchInterval = 60000; // 1 minute for real-time updates
        let countdownInterval = null;
        let retryCount = 0;
        let maxRetries = 3;
        let tooltipElement = null;
        let currentFilter = 'last_24_hours';
        let customFromDate = '';
        let customToDate = '';
        let lastRenderTime = null;

        // Create tooltip element once
        function createTooltip() {
            if (!tooltipElement) {
                tooltipElement = document.createElement('div');
                tooltipElement.className = 'tooltip-popup';
                document.body.appendChild(tooltipElement);
            }
            return tooltipElement;
        }

        // Show tooltip
        function showTooltip(bar, content) {
            const tooltip = createTooltip();
            const rect = bar.getBoundingClientRect();
            
            tooltip.innerHTML = content;
            tooltip.classList.add('show');
            
            // Position tooltip above the bar
            const tooltipRect = tooltip.getBoundingClientRect();
            const left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
            const top = rect.top - tooltipRect.height - 10;
            
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        // Hide tooltip
        function hideTooltip() {
            if (tooltipElement) {
                tooltipElement.classList.remove('show');
            }
        }

        const KOLKATA_TZ = 'Asia/Kolkata';

        function getKolkataYMD(date = new Date()) {
            const formatter = new Intl.DateTimeFormat('en-CA', {
                timeZone: KOLKATA_TZ,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            return formatter.format(date); // YYYY-MM-DD
        }

        function addDaysYMD(ymd, deltaDays) {
            const [year, month, day] = ymd.split('-').map(Number);
            const utc = new Date(Date.UTC(year, month - 1, day));
            utc.setUTCDate(utc.getUTCDate() + deltaDays);
            const y = utc.getUTCFullYear();
            const m = String(utc.getUTCMonth() + 1).padStart(2, '0');
            const d = String(utc.getUTCDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getKolkataParts(date) {
            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: KOLKATA_TZ,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).formatToParts(date);

            const map = {};
            parts.forEach(p => {
                if (p.type !== 'literal') map[p.type] = p.value;
            });

            return {
                year: Number(map.year),
                month: Number(map.month),
                day: Number(map.day),
                hour: Number(map.hour),
                minute: Number(map.minute),
                second: Number(map.second)
            };
        }

        function formatKolkataTime(date) {
            return date.toLocaleTimeString('en-US', {
                timeZone: KOLKATA_TZ,
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function formatKolkataDate(date) {
            return date.toLocaleDateString('en-US', {
                timeZone: KOLKATA_TZ,
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
        }

        function formatKolkataDateTime(date) {
            return `${formatKolkataDate(date)} ${formatKolkataTime(date)}`;
        }

        function buildDownIncidentMap(logs, mergeGapMinutes = 0) {
            // logs are newest -> oldest from API; convert to oldest -> newest for range detection
            const ordered = [...logs].reverse();
            const rawIncidents = [];
            let current = null;

            ordered.forEach(log => {
                if (log.status === 'DOWN') {
                    if (!current) {
                        current = {
                            start: log.checked_at,
                            end: log.checked_at
                        };
                    } else {
                        current.end = log.checked_at;
                    }
                } else if (current) {
                    rawIncidents.push(current);
                    current = null;
                }
            });

            if (current) {
                rawIncidents.push(current);
            }

            // Merge incidents that are within mergeGapMinutes of each other
            const mergeGapMs = Math.max(0, mergeGapMinutes) * 60 * 1000;
            const mergedIncidents = [];
            rawIncidents.forEach(incident => {
                if (mergedIncidents.length === 0) {
                    mergedIncidents.push({ ...incident });
                    return;
                }
                const prev = mergedIncidents[mergedIncidents.length - 1];
                const gap = new Date(incident.start) - new Date(prev.end);
                if (gap >= 0 && gap <= mergeGapMs) {
                    prev.end = incident.end;
                } else {
                    mergedIncidents.push({ ...incident });
                }
            });

            const incidentMap = new Map(); // checked_at -> incident
            ordered.forEach(log => {
                if (log.status !== 'DOWN') return;
                const logTime = new Date(log.checked_at).getTime();
                const match = mergedIncidents.find(inc => {
                    const start = new Date(inc.start).getTime();
                    const end = new Date(inc.end).getTime();
                    return logTime >= start && logTime <= end;
                });
                if (match) {
                    incidentMap.set(log.checked_at, match);
                }
            });

            return incidentMap;
        }

        function getIntervalMinutesForFilter(logs) {
            const isMobile = window.innerWidth <= 640;
            if (currentFilter === 'last_24_hours') {
                return isMobile ? 20 : 10;
            }
            if (currentFilter === 'weekly') {
                return (isMobile ? 4 : 2) * 60;
            }
            if (currentFilter === 'last_1_hour') {
                return isMobile ? 2 : 1;
            }
            if (currentFilter === 'custom') {
                const totalLogs = logs.length;
                const targetBars = isMobile ? 100 : 200;
                return totalLogs > targetBars ? Math.ceil(totalLogs / targetBars) : 1;
            }
            return 1;
        }

        // Build API URL with filter
        function buildApiUrl() {
            let url = 'https://uptime.samfygros.com/logs.php?website=https://studyratna.cc';
            
            const todayStr = getKolkataYMD();
            
            if (currentFilter === 'last_24_hours') {
                // Today's data: from 00:00 to 23:59
                const tomorrowStr = addDaysYMD(todayStr, 1);
                
                url += `&filter=custom&from_date=${todayStr}&to_date=${tomorrowStr}&limit=1440`;
            } else if (currentFilter === 'weekly') {
                // Last 7 days: from 7 days ago 00:00 to tomorrow 23:59
                const weekAgoStr = addDaysYMD(todayStr, -6); // 7 days including today
                const tomorrowStr = addDaysYMD(todayStr, 1);
                
                url += `&filter=custom&from_date=${weekAgoStr}&to_date=${tomorrowStr}&limit=10080`;
            } else if (currentFilter === 'last_1_hour') {
                // Last 1 hour - use default filter
                url += `&filter=last_1_hour&limit=60`;
            } else if (currentFilter === 'custom' && customFromDate && customToDate) {
                // Custom date range
                url += `&filter=custom&from_date=${customFromDate}&to_date=${customToDate}&limit=10000`;
            }
            
            return url;
        }

        // Initialize filter tabs
        function initFilterTabs() {
            const tabs = document.querySelectorAll('.filter-tab');
            const customPicker = document.getElementById('customDatePicker');
            const applyBtn = document.getElementById('applyCustomDate');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const filter = this.dataset.filter;
                    
                    // Update active tab
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Show/hide custom date picker
                    if (filter === 'custom') {
                        customPicker.style.display = 'flex';
                    } else {
                        customPicker.style.display = 'none';
                        currentFilter = filter;
                        fetchUptimeData();
                    }
                });
            });
            
            // Apply custom date
            applyBtn.addEventListener('click', function() {
                const fromDate = document.getElementById('fromDate').value;
                const toDate = document.getElementById('toDate').value;
                
                if (fromDate && toDate) {
                    customFromDate = fromDate;
                    customToDate = toDate;
                    currentFilter = 'custom';
                    fetchUptimeData();
                } else {
                    alert('Please select both From and To dates');
                }
            });
        }

        async function fetchUptimeData() {
            const fetchIndicator = document.getElementById('fetchIndicator');
            const lastUpdate = document.getElementById('lastUpdate');
            const countdown = document.getElementById('countdown');
            const uptimeMeter = document.getElementById('uptimeMeter');
            
            // Show updating status
            countdown.textContent = 'Updating...';
            
            // Show fetching animation
            fetchIndicator.classList.add('fetching');
            
            try {
                const apiUrl = buildApiUrl();
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    cache: 'no-cache',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success && data.logs && data.logs.length > 0) {
                    // Reset retry count on success
                    retryCount = 0;
                    
                    // Simulate slight delay for smooth animation
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    renderUptimeMeter(data.logs);
                    updateStats(data.logs);
                    updateIncidents(data.logs);
                    
                    // Get the latest log's checked_at time from API
                    const latestLog = data.logs[0];
                    const apiCheckedTime = new Date(latestLog.checked_at);
                    
                    // Update last fetch time from API data
                    lastFetchTime = apiCheckedTime.getTime();
                    lastRenderTime = Date.now();
                    lastUpdate.textContent = `Updated (IST): ${formatKolkataDateTime(apiCheckedTime)}`;
                    
                    // Calculate countdown to next fetch interval
                    const nextUpdateIn = Math.max(1, Math.round(fetchInterval / 1000));
                    countdown.textContent = `Next update in ${nextUpdateIn}s`;
                    
                    // Success animation
                    fetchIndicator.classList.remove('fetching');
                    fetchIndicator.classList.add('success');
                    setTimeout(() => {
                        fetchIndicator.classList.remove('success');
                    }, 1000);
                }
            } catch (error) {
                console.error('Fetch error:', error);
                retryCount++;
                
                fetchIndicator.classList.remove('fetching');
                fetchIndicator.classList.add('error');
                
                if (retryCount <= maxRetries) {
                    countdown.textContent = `Retrying... (${retryCount}/${maxRetries})`;
                    
                    // Retry after 5 seconds
                    setTimeout(() => {
                        fetchIndicator.classList.remove('error');
                        fetchUptimeData();
                    }, 5000);
                } else {
                    // Show error but keep existing visuals, retrying in background
                    countdown.textContent = 'Connection issue - Auto-retrying';
                    
                    // Reset retry count after 30 seconds
                    setTimeout(() => {
                        retryCount = 0;
                        fetchIndicator.classList.remove('error');
                    }, 30000);
                }
            }
        }

        function formatDuration(minutes) {
            if (minutes < 1) {
                // Show seconds if less than 1 minute
                const seconds = Math.round(minutes * 60);
                return seconds > 0 ? `${seconds} seconds` : 'Less Than 30 second';
            }
            if (minutes < 60) return `${Math.round(minutes)} min`;
            const hours = Math.floor(minutes / 60);
            const mins = Math.round(minutes % 60);
            return mins > 0 ? `${hours}h ${mins}min` : `${hours}h`;
        }

        function renderUptimeMeter(logs) {
            const meter = document.getElementById('uptimeMeter');
            meter.innerHTML = '';
            
            // Check if mobile
            const isMobile = window.innerWidth <= 640;
            
            // Filter logs based on interval for better visualization
            let filteredLogs = logs;
            let intervalMinutes = 1;
            
            if (currentFilter === 'last_24_hours') {
                // Mobile: 20 min interval, Desktop: 10 min interval
                const interval = isMobile ? 20 : 10;
                intervalMinutes = interval;
                filteredLogs = logs.filter(log => {
                    const parts = getKolkataParts(new Date(log.checked_at));
                    return parts.minute % interval === 0;
                });
            } else if (currentFilter === 'weekly') {
                // Mobile: 4 hour interval, Desktop: 2 hour interval
                const intervalHours = isMobile ? 4 : 2;
                intervalMinutes = intervalHours * 60;
                filteredLogs = logs.filter(log => {
                    const parts = getKolkataParts(new Date(log.checked_at));
                    return parts.minute === 0 && parts.hour % intervalHours === 0;
                });
            } else if (currentFilter === 'last_1_hour') {
                // Mobile: 2 min interval, Desktop: all data
                const interval = isMobile ? 2 : 1;
                intervalMinutes = interval;
                filteredLogs = logs.filter((log, index) => index % interval === 0);
            } else if (currentFilter === 'custom') {
                // For custom, calculate interval based on data size and device
                const totalLogs = logs.length;
                const targetBars = isMobile ? 100 : 200;
                if (totalLogs > targetBars) {
                    const interval = Math.ceil(totalLogs / targetBars);
                    intervalMinutes = interval;
                    filteredLogs = logs.filter((log, index) => index % interval === 0);
                } else {
                    intervalMinutes = 1;
                    filteredLogs = logs;
                }
            }

            // Ensure DOWN logs are always visible in the meter (preserve original order)
            if (currentFilter === 'last_24_hours' || currentFilter === 'weekly' || currentFilter === 'custom' || currentFilter === 'last_1_hour') {
                const keepIds = new Set(filteredLogs.map(log => log.checked_at));
                logs.forEach(log => {
                    if (log.status === 'DOWN') {
                        keepIds.add(log.checked_at);
                    }
                });
                filteredLogs = logs.filter(log => keepIds.has(log.checked_at));
            }
            
            // Calculate how many bars can fit based on screen width
            const meterWidth = meter.offsetWidth || 800;
            const barWidth = window.innerWidth <= 400 ? 2 : (window.innerWidth <= 640 ? 2.5 : 4);
            const gapWidth = 1;
            const maxBars = Math.floor(meterWidth / (barWidth + gapWidth));
            
            // Use filtered logs count or max bars, whichever is smaller
            const targetMaxBars = isMobile ? 150 : 200;
            const totalBars = Math.min(maxBars, targetMaxBars);
            const dataCount = Math.min(filteredLogs.length, totalBars);
            
            const incidentMap = buildDownIncidentMap(logs, intervalMinutes);

            // For coarse ranges, collapse multiple DOWN bars into a single bar per incident
            if (currentFilter === 'weekly' || currentFilter === 'custom') {
                const seenIncidentKeys = new Set();
                filteredLogs = filteredLogs.filter(log => {
                    if (log.status !== 'DOWN') return true;
                    const incident = incidentMap.get(log.checked_at);
                    if (!incident) return true;
                    const key = `${incident.start}|${incident.end}`;
                    if (seenIncidentKeys.has(key)) return false;
                    seenIncidentKeys.add(key);
                    return true;
                });
            }

            // Reverse to show oldest to newest (left to right)
            const reversedLogs = [...filteredLogs]
                .sort((a, b) => new Date(a.checked_at) - new Date(b.checked_at))
                .slice(-dataCount);
            
            // Render actual data bars
            reversedLogs.forEach((log, index) => {
                const bar = document.createElement('div');
                let barClass = `uptime-bar ${log.status.toLowerCase()}`;
                if (log.status === 'DOWN') {
                    const incident = incidentMap.get(log.checked_at);
                    if (incident) {
                        const durationMs = new Date(incident.end) - new Date(incident.start);
                        const durationMinutes = durationMs / 60000;
                        // Ignore downtime less than 1 minute - treat as UP
                        if (durationMinutes < 1) {
                            barClass = 'uptime-bar up';
                        }
                    }
                }
                bar.className = barClass;
                bar.style.animationDelay = `${index * 5}ms`;
                
                const date = new Date(log.checked_at);
                
                // Calculate time difference from now
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.round(diffMs / 60000);
                
                // Format time ago
                let timeAgo = '';
                if (diffMins < 1) {
                    timeAgo = 'Less Than a minute';
                } else if (diffMins < 60) {
                    timeAgo = `${diffMins} min ago`;
                } else {
                    const hours = Math.floor(diffMins / 60);
                    const mins = diffMins % 60;
                    timeAgo = mins > 0 ? `${hours}h ${mins}m ago` : `${hours}h ago`;
                }
                
                // Format exact time
                const exactTime = formatKolkataTime(date);
                const exactDate = formatKolkataDate(date);

                let downRangeLine = '';
                if (log.status === 'DOWN') {
                    const incident = incidentMap.get(log.checked_at);
                    if (incident) {
                        const fromText = formatKolkataDateTime(new Date(incident.start));
                        const toText = formatKolkataDateTime(new Date(incident.end));
                        downRangeLine = `<div style="font-size: 11px; opacity: 0.85; margin-bottom: 3px;">${fromText} - ${toText}</div>`;
                    }
                }
                
                const tooltipContent = log.status === 'DOWN'
                    ? `
                        <div style="font-weight: 600; margin-bottom: 4px; font-size: 13px;">${log.status}</div>
                        ${downRangeLine}
                    `
                    : `
                        <div style="font-weight: 600; margin-bottom: 4px; font-size: 13px;">${log.status}</div>
                        <div style="font-size: 11px; opacity: 0.9; margin-bottom: 3px;">${timeAgo}</div>
                        <div style="font-size: 11px; opacity: 0.85; margin-bottom: 3px;">${exactDate} ${exactTime}</div>
                        <div style="font-size: 11px; opacity: 0.8;">${log.response_time}ms</div>
                        <div style="font-size: 10px; opacity: 0.7; margin-top: 3px; font-style: italic;">
                            ${currentFilter === 'last_24_hours' ? (window.innerWidth <= 640 ? '20 min interval' : '10 min interval') : 
                              currentFilter === 'weekly' ? (window.innerWidth <= 640 ? '4 hour interval' : '2 hour interval') : 
                              currentFilter === 'last_1_hour' ? (window.innerWidth <= 640 ? '2 min interval' : '1 min interval') : 'Custom interval'}
                        </div>
                    `;
                
                // Store tooltip content in data attribute
                bar.dataset.tooltip = tooltipContent;
                
                // Hover events
                bar.addEventListener('mouseenter', function(e) {
                    if (activeBar && activeBar !== bar) {
                        activeBar.classList.remove('active');
                        activeBar = null;
                    }
                    showTooltip(bar, tooltipContent);
                });
                
                bar.addEventListener('mouseleave', function(e) {
                    if (!bar.classList.contains('active')) {
                        hideTooltip();
                    }
                });
                
                // Click events
                bar.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    
                    // If this bar is already active, deactivate it
                    if (bar.classList.contains('active')) {
                        bar.classList.remove('active');
                        activeBar = null;
                        hideTooltip();
                        return;
                    }
                    
                    // Deactivate previous active bar
                    if (activeBar) {
                        activeBar.classList.remove('active');
                    }
                    
                    // Activate current bar
                    bar.classList.add('active');
                    activeBar = bar;
                    showTooltip(bar, tooltipContent);
                });
                
                // Touch events for mobile
                bar.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                    
                    // If this bar is already active, deactivate it
                    if (bar.classList.contains('active')) {
                        bar.classList.remove('active');
                        activeBar = null;
                        hideTooltip();
                        return;
                    }
                    
                    // Deactivate previous active bar
                    if (activeBar) {
                        activeBar.classList.remove('active');
                    }
                    
                    // Activate current bar
                    bar.classList.add('active');
                    activeBar = bar;
                    showTooltip(bar, tooltipContent);
                }, { passive: true });
                
                meter.appendChild(bar);
            });
            
            // Add grey placeholder bars for remaining slots
            const placeholderCount = totalBars - dataCount;
            for (let i = 0; i < placeholderCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'uptime-bar placeholder';
                meter.appendChild(bar);
            }

            // Close tooltip when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.uptime-bar')) {
                    if (activeBar) {
                        activeBar.classList.remove('active');
                        activeBar = null;
                    }
                    hideTooltip();
                }
            });
            
            document.addEventListener('touchstart', function(e) {
                if (!e.target.closest('.uptime-bar')) {
                    if (activeBar) {
                        activeBar.classList.remove('active');
                        activeBar = null;
                    }
                    hideTooltip();
                }
            }, { passive: true });

            // Update status indicator
            const latestStatus = logs[0].status.toLowerCase();
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            statusDot.className = `status-dot ${latestStatus}`;
            statusText.textContent = latestStatus === 'up' ? 'All Systems Operational' : 'System Down';
            statusText.style.color = latestStatus === 'up' ? '#22c55e' : '#ef4444';
        }

        function updateStats(logs) {
            const totalChecks = logs.length;
            const upChecks = logs.filter(log => log.status === 'UP').length;
            const uptime = ((upChecks / totalChecks) * 100).toFixed(2);
            
            const responseTimes = logs.map(log => log.response_time);
            const avgResponse = (responseTimes.reduce((a, b) => a + b, 0) / responseTimes.length).toFixed(0);
            
            // Get time range label
            let timeRangeLabel = '';
            if (currentFilter === 'last_1_hour') {
                timeRangeLabel = 'Last Hour';
            } else if (currentFilter === 'last_24_hours') {
                timeRangeLabel = 'Today';
            } else if (currentFilter === 'weekly') {
                timeRangeLabel = 'Last 7 Days';
            } else if (currentFilter === 'custom') {
                timeRangeLabel = 'Custom Range';
            }
            
            const statsContainer = document.getElementById('uptimeStats');
            statsContainer.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${uptime}%</div>
                    <div class="stat-label">Uptime (${timeRangeLabel})</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${avgResponse}ms</div>
                    <div class="stat-label">Avg Response</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${totalChecks}</div>
                    <div class="stat-label">Total Checks</div>
                </div>
            `;
        }

        function updateIncidents(logs) {
            const incidentsContainer = document.getElementById('incidentsContainer');
            const incidentsList = document.getElementById('incidentsList');
            
            const intervalMinutes = getIntervalMinutesForFilter(logs);
            const incidentMap = buildDownIncidentMap(logs, intervalMinutes);

            const seenKeys = new Set();
            const incidents = [];
            const ordered = [...logs].reverse(); // oldest -> newest
            ordered.forEach(log => {
                if (log.status !== 'DOWN') return;
                const incident = incidentMap.get(log.checked_at);
                if (!incident) return;
                const key = `${incident.start}|${incident.end}`;
                if (seenKeys.has(key)) return;
                seenKeys.add(key);

                const start = new Date(incident.start);
                const end = new Date(incident.end);
                const durationMs = end - start;
                const duration = durationMs / 60000;
                
                // Ignore incidents less than 1 minute
                if (duration < 1) return;
                
                incidents.push({
                    startTime: incident.start,
                    endTime: incident.end,
                    duration,
                    resolved: true
                });
            });

            // Show newest first
            incidents.reverse();

            // Show only last 5 incidents
            const recentIncidents = incidents.slice(0, 5);
            
            if (recentIncidents.length > 0) {
                incidentsContainer.classList.add('show');
                incidentsList.innerHTML = recentIncidents.map((incident, index) => {
                    const startDate = new Date(incident.startTime);
                    const endDate = new Date(incident.endTime);
                    const incidentTime = `${formatKolkataDateTime(startDate)} - ${formatKolkataDateTime(endDate)}`;
                    const statusClass = incident.resolved ? 'resolved' : 'down';
                    const cardClass = incident.resolved ? 'incident-card resolved-card' : 'incident-card down-card';
                    
                    // Add grey separator line between incidents (except for first one)
                    const separator = index > 0 ? '<div style="height: 1px; background: #e5e5e5; margin: 10px 0;"></div>' : '';
                    
                    return `
                        ${separator}
                        <div class="${cardClass}" style="animation-delay: ${index * 100}ms">
                            <div class="incident-header">
                                <span class="incident-status ${statusClass}">
                                    ${incident.resolved ? '✓ Resolved' : '⚠ Down'}
                                </span>
                                <span class="incident-time">${incidentTime}</span>
                            </div>
                            <div class="incident-details">
                                Server was down and now back up ✓
                            </div>
                            <div class="incident-duration">
                                ⏱ Duration: ${formatDuration(incident.duration)}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                incidentsContainer.classList.add('show');
                incidentsList.innerHTML = '<div class="no-incidents">✓ No incidents detected! All systems running smoothly.</div>';
            }
        }

        // Update countdown timer
        function updateCountdown() {
            const countdown = document.getElementById('countdown');
            if (!lastFetchTime || !lastRenderTime) {
                countdown.textContent = 'Initializing...';
                return;
            }
            
            // Get current time
            const now = Date.now();
            
            // Calculate elapsed time since last render
            const elapsed = Math.floor((now - lastRenderTime) / 1000);
            
            // Calculate next expected update time based on fetch interval
            const intervalSeconds = Math.max(1, Math.round(fetchInterval / 1000));
            const nextUpdateIn = intervalSeconds - (elapsed % intervalSeconds);
            
            if (nextUpdateIn > 0 && nextUpdateIn <= intervalSeconds) {
                countdown.textContent = `Next update in ${nextUpdateIn}s`;
            } else {
                countdown.textContent = 'Updating...';
            }
        }

        // Fetch data on page load
        initFilterTabs();
        fetchUptimeData();
        
        // Real-time refresh every 1 minute
        setInterval(fetchUptimeData, fetchInterval);
        
        // Update countdown every second
        if (countdownInterval) {
            clearInterval(countdownInterval);
        }
        countdownInterval = setInterval(updateCountdown, 1000);
        
        // Re-render on window resize to adjust bar count
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                // Trigger re-fetch to recalculate bars
                fetchUptimeData();
            }, 300);
        });
    </script>
